<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Abysa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #000;
        --panel: #0d0d0d;
        --line: #222;
        --mute: #777;
        --text: #e8e8e8;
        --white: #fff;
        --hover: #1a1a1a;
        --mono:
          ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
        --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        font-size: 14px;
      }
      body {
        display: grid;
        grid-template-rows: 52px 1fr 28px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 16px;
        border-bottom: 1px solid var(--line);
      }
      .brand {
        font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--white);
        margin-right: auto;
      }
      select,
      button {
        font: inherit;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        height: 34px;
        padding: 0 14px;
        cursor: pointer;
      }
      select:hover,
      button:hover {
        background: var(--hover);
      }
      button.run {
        background: var(--white);
        color: #000;
        border-color: var(--white);
        font-weight: 600;
      }
      button.run:hover {
        background: #d0d0d0;
      }
      button.run:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      *:focus-visible {
        outline: 2px solid var(--white);
        outline-offset: 2px;
      }
      main {
        display: grid;
        grid-template-columns: 1fr 380px;
        min-height: 0;
      }
      .editor {
        display: grid;
        grid-template-rows: 38px 1fr;
        min-height: 0;
        min-width: 0;
        border-right: 1px solid var(--line);
      }
      .tab {
        display: flex;
        align-items: center;
        padding: 0 16px;
        border-bottom: 1px solid var(--line);
        color: var(--white);
      }
      #editor {
        min-height: 0;
        min-width: 0;
        position: relative;
      }
      #fb {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        outline: 0;
        resize: none;
        background: #000;
        color: var(--text);
        font: 14px/22px var(--mono);
        padding: 12px 16px;
        tab-size: 4;
        white-space: pre;
      }
      aside {
        display: grid;
        grid-template-rows: 38px 1fr 38px 1fr;
        min-height: 0;
      }
      aside h2 {
        margin: 0;
        font-size: 13px;
        font-weight: 500;
        color: var(--mute);
        display: flex;
        align-items: center;
        padding: 0 16px;
        border-bottom: 1px solid var(--line);
        border-top: 1px solid var(--line);
      }
      aside h2:first-child {
        border-top: 0;
      }
      aside textarea,
      aside pre {
        margin: 0;
        width: 100%;
        height: 100%;
        border: 0;
        outline: 0;
        resize: none;
        background: transparent;
        color: var(--text);
        font: 13px/20px var(--mono);
        padding: 12px 16px;
        overflow: auto;
        white-space: pre-wrap;
      }
      pre.err {
        color: #aaa;
      }
      footer {
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 0 16px;
        border-top: 1px solid var(--line);
        color: var(--mute);
        font-size: 12px;
      }
      footer .sp {
        margin-left: auto;
      }
      dialog {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 24px;
        width: min(480px, 92vw);
      }
      dialog::backdrop {
        background: rgba(0, 0, 0, 0.7);
      }
      dialog label {
        display: block;
        margin: 14px 0 6px;
        color: var(--mute);
      }
      dialog input {
        width: 100%;
        height: 36px;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--text);
        padding: 0 10px;
        font: 13px var(--mono);
      }
      dialog .row {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 20px;
      }
      @media (max-width: 800px) {
        main {
          grid-template-columns: 1fr;
          grid-template-rows: 60% 40%;
        }
        .editor {
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
        footer .sp {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">AbysaCompiler</div>
      <select id="lang" aria-label="Language">
        <option value="cpp">C++</option>
        <option value="python">Python</option>
        <option value="javascript">JavaScript</option>
        <option value="java">Java</option>
      </select>
      <button class="run" id="run">Run</button>
      <button id="dl">Save</button>
      <button id="cfg">Settings</button>
    </header>
    <main>
      <section class="editor">
        <div class="tab" id="tabname">main.cpp</div>
        <div id="editor"></div>
      </section>
      <aside>
        <h2>Input (stdin)</h2>
        <textarea id="stdin" spellcheck="false" placeholder="..."></textarea>
        <h2>Output</h2>
        <pre id="out">"Run" or Ctrl+Enter</pre>
      </aside>
    </main>
    <footer>
      <span id="status"></span>
      <span class="sp">Ctrl+Enter — start · Ctrl+S — save file</span>
    </footer>
    <dialog id="dlg">
      <strong>Settings</strong>
      <label for="runUrl">Code execution URL (Wandbox)</label>
      <input id="runUrl" />
      <label for="aiUrl">Your AI server address</label>
      <input id="aiUrl" placeholder="http://localhost:8000/generate" />
      <div class="row">
        <button id="cancel">Cancel</button
        ><button class="run" id="save">Save</button>
      </div>
    </dialog>
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);
      const CDN = "https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min";
      const LANGS = {
        cpp: {
          file: "main.cpp",
          wb: "gcc-head",
          tpl: "#include <iostream>\nusing namespace std;\n\nint main() {\n    \n    return 0;\n}\n",
        },
        python: {
          file: "main.py",
          wb: "cpython-head",
          tpl: 'print("Hello, Abysa")\n',
        },
        javascript: {
          file: "main.js",
          wb: "nodejs-head",
          tpl: 'console.log("Hello, Abysa");\n',
        },
        java: {
          file: "Main.java",
          wb: "openjdk-head",
          tpl: "public class Main {\n    public static void main(String[] args) {\n        \n    }\n}\n",
        },
      };
      const store = {
        get(k, d) {
          try {
            return localStorage.getItem(k) ?? d;
          } catch {
            return d;
          }
        },
        set(k, v) {
          try {
            localStorage.setItem(k, v);
          } catch {}
        },
      };
      const cfg = {
        runUrl: store.get(
          "abysa.wandboxUrl",
          "https://wandbox.org/api/compile.json",
        ),
        aiUrl: "http://localhost:8787/api/ai",
      };
      let lang = store.get("abysa.lang", "cpp");
      if (!LANGS[lang]) lang = "cpp";
      const setStatus = (t) => ($("status").textContent = t);
      function setOut(t, err) {
        $("out").textContent = t;
        $("out").className = err ? "err" : "";
      }
      let ed = null,
        fb = null;
      const getCode = () => (ed ? ed.getValue() : fb.value);
      const setCode = (v) => (ed ? ed.setValue(v) : (fb.value = v));
      function loadLang() {
        $("lang").value = lang;
        $("tabname").textContent = LANGS[lang].file;
        if (ed) monaco.editor.setModelLanguage(ed.getModel(), lang);
        const saved = store.get("abysa.code." + lang, null);
        setCode(saved ?? LANGS[lang].tpl);
        if (ed && saved === null && lang === "cpp")
          ed.setPosition({ lineNumber: 5, column: 5 });
        if (ed) ed.focus();
      }
      function saveCode() {
        store.set("abysa.code." + lang, getCode());
      }
      function download() {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(
          new Blob([getCode()], { type: "text/plain" }),
        );
        a.download = LANGS[lang].file;
        a.click();
        URL.revokeObjectURL(a.href);
      }
      async function run() {
        const btn = $("run");
        btn.disabled = true;
        setStatus("In progress…");
        const t0 = performance.now();
        let code = getCode();
        if (lang === "java")
          code = code.replace(/^public\s+(class|interface|enum)/gm, "$1");
        try {
          const res = await fetch(cfg.runUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              compiler: LANGS[lang].wb,
              code,
              stdin: $("stdin").value,
              save: false,
            }),
          });
          if (!res.ok) throw new Error("the server responded: " + res.status);
          const d = await res.json();
          const ce = d.compiler_error || "";
          if (ce && !("program_message" in d) && !("program_output" in d)) {
            setOut(ce, true);
          } else {
            let t =
              (d.program_output || "") +
              (d.program_error ? "\n" + d.program_error : "");
            const bad = d.status && d.status !== "0";
            if (bad && ce) t += "\n" + ce;
            if (bad) t += "\n[exit code " + d.status + "]";
            setOut(t || "(empty output)", bad);
          }
          setStatus("Ready · " + Math.round(performance.now() - t0) + " ms");
        } catch (e) {
          setOut(
            "Failed to execute the code: " + e.message + "\nError...",
            true,
          );
          setStatus("Error");
        } finally {
          btn.disabled = false;
        }
      }
      async function aiGenerate() {
        if (lang !== "cpp") {
          setStatus("AI is available only for C++.");
          return;
        }
        const model = ed.getModel();
        const ln = ed.getPosition().lineNumber;
        const text = model.getLineContent(ln);
        const m = text.match(/^(\s*)\/\/ai\s+(.+)$/i);
        if (!m) return;
        setStatus("Generation...");
        ed.updateOptions({ readOnly: true });
        try {
          const res = await fetch(cfg.aiUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              prompt: m[2].trim(),
              code: ed.getValue(),
            }),
          });
          const d = await res.json();
          if (!res.ok)
            throw new Error(d.error || "the server responded: " + res.status);
          if (!d.code) throw new Error("empty response");
          const code = d.code
            .replace(/^```(?:cpp|c\+\+)?\s*/i, "")
            .replace(/\s*```\s*$/, "")
            .replace(/^\s*\n/, "")
            .trimEnd();
          const lines = code.replace(/\t/g, "    ").split("\n");
          const min = Math.min(
            ...lines
              .filter((l) => l.trim())
              .map((l) => l.match(/^ */)[0].length),
          );
          const before = model
            .getValueInRange(new monaco.Range(1, 1, ln, 1))
            .replace(/\/\/.*$/gm, "")
            .replace(/"(?:\\.|[^"\\])*"/g, '""');
          let depth = 0;
          for (const ch of before) {
            if (ch === "{") depth++;
            else if (ch === "}") depth--;
          }
          const indent = " ".repeat(Math.max(depth, 0) * 4);
          const replacement = lines
            .map((l) => (l.trim() ? indent + l.slice(min) : ""))
            .join("\n");
          ed.updateOptions({ readOnly: false });
          ed.executeEdits("abysa-ai", [
            {
              range: new monaco.Range(ln, 1, ln, text.length + 1),
              text: replacement,
            },
          ]);
          saveCode();
          setStatus("Code inserted!");
        } catch (e) {
          setStatus("AI error: " + e.message);
        } finally {
          ed.updateOptions({ readOnly: false });
          ed.focus();
        }
      }
      // ===== Formatting (Ctrl+P / Cmd+P) =====
      function formatCode(src, language) {
        const IND = "    ";
        const lines = src.replace(/\r\n?/g, "\n").split("\n");
        const out = [];
        const map = new Array(lines.length).fill(0);
        const finish = () => {
          while (out.length && out[out.length - 1] === "") out.pop();
          const last = Math.max(out.length - 1, 0);
          for (let i = 0; i < map.length; i++) map[i] = Math.min(map[i], last);
          return {
            text: out.length ? out.join("\n") + "\n" : "",
            lines: out,
            map,
          };
        };
        // Python: indentation is part of the syntax, so only clean whitespace
        if (language === "python") {
          lines.forEach((l, i) => {
            map[i] = out.length;
            out.push(l.trimEnd());
          });
          return finish();
        }

        const cpp = language === "cpp";
        const js = language === "javascript";
        const stack = []; // frames: {t: "B" | "S" | "P", x: extra offset}
        let inBlock = false,
          inTpl = false,
          macro = false;
        let extra = 0,
          ctrlBase = null,
          ctrlLevel = 0,
          prevSwitch = false,
          curX = 0;

        const sum = (st) =>
          st.reduce(
            (n, f) => n + f.x + (f.t === "B" ? 1 : f.t === "S" ? 2 : 0),
            0,
          );
        const countP = (st) => st.filter((f) => f.t === "P").length;
        const closeBrace = (st) => {
          let j = st.length - 1;
          while (j >= 0 && st[j].t === "P") j--;
          if (j < 0) return null;
          const f = st[j];
          st.length = j;
          return f;
        };

        // walks one line, skipping strings/comments, updates brackets stack
        function scan(s) {
          let code = "";
          for (let k = 0; k < s.length; k++) {
            const c = s[k],
              d = s[k + 1];
            if (inBlock) {
              if (c === "*" && d === "/") {
                inBlock = false;
                k++;
                code += " ";
              }
              continue;
            }
            if (inTpl) {
              if (c === "\\") k++;
              else if (c === "`") {
                inTpl = false;
                code += "``";
              }
              continue;
            }
            if (c === "/" && d === "/") break;
            if (c === "/" && d === "*") {
              inBlock = true;
              k++;
              continue;
            }
            if (
              c === '"' ||
              (c === "'" && !(cpp && /\w/.test(s[k - 1] || "")))
            ) {
              k++;
              while (k < s.length && s[k] !== c) {
                if (s[k] === "\\") k++;
                k++;
              }
              code += c + c;
              continue;
            }
            if (c === "`" && js) {
              inTpl = true;
              continue;
            }
            code += c;
            if (c === "{") {
              const before = code.slice(0, -1);
              const sw =
                /\bswitch\s*\(.*\)\s*$/.test(before) ||
                (before.trim() === "" && prevSwitch);
              stack.push({ t: sw ? "S" : "B", x: curX });
            } else if (c === "(" || c === "[") {
              stack.push({ t: "P", x: curX });
            } else if (c === "}") {
              closeBrace(stack);
            } else if (
              (c === ")" || c === "]") &&
              stack.length &&
              stack[stack.length - 1].t === "P"
            ) {
              stack.pop();
            }
          }
          return code;
        }

        for (let i = 0; i < lines.length; i++) {
          const raw = lines[i],
            t = raw.trim();
          map[i] = out.length;

          if (inTpl) {
            out.push(raw);
            scan(raw);
            continue;
          }
          if (macro) {
            out.push(raw.trimEnd());
            macro = /\\\s*$/.test(raw);
            continue;
          }
          if (inBlock) {
            const top = stack[stack.length - 1];
            const lv = sum(stack) + (top && top.t === "P" ? 1 : 0);
            out.push(
              t === ""
                ? ""
                : t[0] === "*"
                  ? IND.repeat(lv) + " " + t
                  : raw.trimEnd(),
            );
            curX = 0;
            scan(raw);
            continue;
          }
          if (t === "") {
            if (out.length && out[out.length - 1] !== "") out.push("");
            continue;
          }
          if (cpp && t[0] === "#") {
            out.push(t);
            macro = /\\$/.test(t);
            continue;
          }

          // closers at the start of the line (}, ), ]) are applied first
          const lm = t.match(/^[}\])]+/);
          const st = stack.slice();
          let fp = null;
          if (lm) {
            for (const ch of lm[0]) {
              if (ch === "}") {
                const f = closeBrace(st);
                if (!f) break;
                fp = fp || f;
              } else if (st.length && st[st.length - 1].t === "P") {
                const f = st.pop();
                fp = fp || f;
              } else break;
            }
          }
          const rest = t.slice(lm ? lm[0].length : 0).trimStart();
          const top = st[st.length - 1];
          const base = sum(st);
          let level = base;
          if (fp) level += fp.x;
          else {
            if (top && top.t === "P") level += 1;
            if (
              top &&
              top.t === "S" &&
              /^(?:case\b[^;{]*|default\s*):(?!:)/.test(rest)
            )
              level -= 1;
            else if (
              top &&
              top.t === "B" &&
              /^(?:public|private|protected)\s*:(?!:)/.test(rest)
            )
              level -= 1;
            if (extra > 0 && rest[0] !== "{") level += extra;
          }
          level = Math.max(level, 0);
          curX = level - base;
          out.push(IND.repeat(level) + t);

          if (ctrlBase === null && /^(?:else\s+)?(?:if|for|while)\b/.test(rest)) {
            ctrlBase = countP(st);
            ctrlLevel = level;
          }
          const code = scan(t);
          const ct = code.trim();

          // if (...) / for (...) / while (...) / else / do without { }:
          // the next statement is indented one more level
          let headerLevel = null;
          if (ctrlBase !== null && countP(stack) <= ctrlBase) {
            ctrlBase = null;
            if (ct.endsWith(")")) headerLevel = ctrlLevel;
          }
          if (/(?:^|[^\w$.])(?:else|do)$/.test(ct)) headerLevel = level;
          if (ct !== "") {
            extra = headerLevel === null ? 0 : headerLevel - sum(stack) + 1;
            prevSwitch = /\bswitch\s*\(.*\)$/.test(ct);
          }
        }
        return finish();
      }

      function formatNow() {
        if ($("dlg").open) return;
        const src = getCode().replace(/\r\n?/g, "\n");
        const { text, lines: nl, map } = formatCode(src, lang);
        if (text === src) {
          setStatus("Already formatted");
          return;
        }
        const adjust = (oldLine, oldCol, oldText) => {
          const idx = Math.min(map[oldLine] ?? 0, Math.max(nl.length - 1, 0));
          const newText = nl[idx] ?? "";
          const oldInd = oldText.length - oldText.trimStart().length;
          const newInd = newText.length - newText.trimStart().length;
          let col = oldCol <= oldInd ? newInd : oldCol + (newInd - oldInd);
          col = Math.max(0, Math.min(col, newText.length));
          return { idx, col };
        };
        if (ed) {
          const model = ed.getModel();
          const pos = ed.getPosition();
          const r = adjust(
            pos.lineNumber - 1,
            pos.column - 1,
            model.getLineContent(pos.lineNumber),
          );
          ed.pushUndoStop();
          ed.executeEdits("abysa-format", [
            { range: model.getFullModelRange(), text },
          ]);
          ed.pushUndoStop();
          ed.setPosition({ lineNumber: r.idx + 1, column: r.col + 1 });
          ed.revealLineInCenterIfOutsideViewport(r.idx + 1);
          ed.focus();
        } else {
          const p = fb.selectionStart;
          const before = src.slice(0, p).split("\n");
          const oldLine = before.length - 1;
          const r = adjust(
            oldLine,
            before[oldLine].length,
            src.split("\n")[oldLine],
          );
          fb.focus();
          fb.select();
          if (!document.execCommand("insertText", false, text)) fb.value = text;
          let off = r.col;
          for (let k = 0; k < r.idx; k++) off += nl[k].length + 1;
          fb.setSelectionRange(off, off);
          saveCode();
        }
        setStatus("Formatted");
      }
      document.addEventListener(
        "keydown",
        (e) => {
          if (
            (e.ctrlKey || e.metaKey) &&
            !e.shiftKey &&
            !e.altKey &&
            e.code === "KeyP"
          ) {
            e.preventDefault();
            e.stopPropagation();
            formatNow();
          }
        },
        true,
      );

      const SNIPPETS = {
        msv: "int n;\ncin >> n;\nint a[n];\nfor (int i = 0; i < n; i++) {\n    cin >> a[i];\n}",
        mtx: "int n, m;\ncin >> n >> m;\nint a[n][m];\nfor (int i = 0; i < n; i++) {\n    for (int j = 0; j < m; j++) {\n        cin >> a[i][j];\n    }\n}",
        str: "string s;\ncin >> s;",
      };
      function expandSnippet(line) {
        const m = line.match(/^(\s*)(\w+)\s*$/);
        if (!m || !Object.hasOwn(SNIPPETS, m[2])) return null;
        return SNIPPETS[m[2]]
          .split("\n")
          .map((l) => m[1] + l)
          .join("\n");
      }
      function insertSnippet() {
        const ln = ed.getPosition().lineNumber;
        const text = ed.getModel().getLineContent(ln);
        const out = expandSnippet(text);
        if (!out) return;
        ed.executeEdits("abysa-snip", [
          { range: new monaco.Range(ln, 1, ln, text.length + 1), text: out },
        ]);
        const rows = out.split("\n");
        ed.setPosition({
          lineNumber: ln + rows.length - 1,
          column: rows[rows.length - 1].length + 1,
        });
      }
      function insertTemplate() {
        const ln = ed.getPosition().lineNumber,
          text = ed.getModel().getLineContent(ln);
        ed.executeEdits("abysa-tpl", [
          {
            range: new monaco.Range(ln, 1, ln, text.length + 1),
            text: "#include <iostream>\nusing namespace std;\n\nint main() {\n    \n}",
          },
        ]);
        ed.setPosition({ lineNumber: ln + 4, column: 5 });
      }

      function initMonaco() {
        monaco.editor.defineTheme("abysa", {
          base: "vs-dark",
          inherit: true,
          rules: [
            { token: "", foreground: "e8e8e8" },
            { token: "keyword", foreground: "ffffff", fontStyle: "bold" },
            { token: "type", foreground: "cfcfcf" },
            { token: "type.identifier", foreground: "cfcfcf" },
            { token: "predefined", foreground: "ffffff" },
            { token: "string", foreground: "a3a3a3" },
            { token: "number", foreground: "d4d4d4" },
            { token: "comment", foreground: "666666", fontStyle: "italic" },
            { token: "delimiter", foreground: "9a9a9a" },
            { token: "operator", foreground: "bdbdbd" },
            { token: "identifier", foreground: "e8e8e8" },
          ],
          colors: {
            "editor.background": "#000000",
            "editor.foreground": "#e8e8e8",
            "editorLineNumber.foreground": "#4a4a4a",
            "editorLineNumber.activeForeground": "#bbbbbb",
            "editor.lineHighlightBackground": "#0f0f0f",
            "editor.selectionBackground": "#3a3a3a",
            "editorCursor.foreground": "#ffffff",
            "editorIndentGuide.background1": "#1c1c1c",
            "editorIndentGuide.activeBackground1": "#444444",
            "editorWidget.background": "#0d0d0d",
            "editorSuggestWidget.background": "#0d0d0d",
            "editorSuggestWidget.selectedBackground": "#2a2a2a",
            "editorBracketMatch.background": "#2a2a2a",
            "editorBracketMatch.border": "#666666",
            "editorBracketHighlight.foreground1": "#ffffff",
            "editorBracketHighlight.foreground2": "#bdbdbd",
            "editorBracketHighlight.foreground3": "#8a8a8a",
          },
        });
        ed = monaco.editor.create($("editor"), {
          value: "",
          language: lang,
          theme: "abysa",
          automaticLayout: true,
          fontFamily:
            'ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace',
          fontSize: 14,
          lineHeight: 22,
          minimap: { enabled: false },
          scrollBeyondLastLine: false,
          padding: { top: 12 },
          tabSize: 4,
          insertSpaces: true,
          detectIndentation: false,
          useTabStops: true,
          autoIndent: "full",
          formatOnPaste: true,
          formatOnType: true,
          autoClosingBrackets: "always",
          autoClosingQuotes: "always",
          autoSurround: "languageDefined",
          bracketPairColorization: { enabled: true },
          guides: { indentation: true },
          smoothScrolling: true,
          cursorSmoothCaretAnimation: "on",
          cursorBlinking: "smooth",
          mouseWheelZoom: true,
          renderLineHighlight: "line",
        });
        const aiKey = ed.createContextKey("abysaAi", false);
        const hashKey = ed.createContextKey("abysaHash", false);
        const snipKey = ed.createContextKey("abysaSnip", false);
        const check = () => {
          const p = ed.getPosition();
          const t = p ? ed.getModel().getLineContent(p.lineNumber) : "";
          aiKey.set(/^\s*\/\/ai\s+\S/i.test(t));
          hashKey.set(lang === "cpp" && t.trim() === "#");
          snipKey.set(lang === "cpp" && expandSnippet(t) !== null);
        };
        ed.onDidChangeCursorPosition(check);
        ed.onDidChangeModelContent(() => {
          check();
          saveCode();
        });
        ed.addCommand(
          monaco.KeyCode.Tab,
          aiGenerate,
          "abysaAi && !suggestWidgetVisible && !inSnippetMode",
        );
        ed.addCommand(
          monaco.KeyCode.Tab,
          insertTemplate,
          "abysaHash && !suggestWidgetVisible",
        );
        ed.addCommand(monaco.KeyCode.Tab, insertSnippet, "abysaSnip");
        ed.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, run);
        ed.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, download);
        loadLang();
        setStatus("Ready");
      }
      // Fallback when the Monaco CDN is unreachable
      function initFallback() {
        fb = document.createElement("textarea");
        fb.id = "fb";
        fb.spellcheck = false;
        $("editor").appendChild(fb);
        fb.addEventListener("input", saveCode);
        fb.addEventListener("keydown", (e) => {
          if (e.key === "Tab") {
            e.preventDefault();
            const v = fb.value,
              p = fb.selectionStart;
            const st = v.lastIndexOf("\n", p - 1) + 1;
            let en = v.indexOf("\n", p);
            if (en < 0) en = v.length;
            const out = lang === "cpp" ? expandSnippet(v.slice(st, en)) : null;
            if (out) fb.setRangeText(out, st, en, "end");
            else fb.setRangeText("    ", fb.selectionStart, fb.selectionEnd, "end");
            saveCode();
          } else if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
            e.preventDefault();
            run();
          } else if (e.key === "Enter") {
            e.preventDefault();
            const v = fb.value,
              p = fb.selectionStart;
            const ind =
              (v.slice(v.lastIndexOf("\n", p - 1) + 1, p).match(/^\s*/) || [
                "",
              ])[0] + (v[p - 1] === "{" ? "    " : "");
            fb.setRangeText("\n" + ind, p, fb.selectionEnd, "end");
            saveCode();
          }
        });
        loadLang();
        setStatus(
          "Simple editor: Monaco could not be loaded (check access to cdn.jsdelivr.net)",
        );
      }
      window.MonacoEnvironment = {
        getWorkerUrl: () =>
          "data:text/javascript;charset=utf-8," +
          encodeURIComponent(
            "self.MonacoEnvironment={baseUrl:'" +
              CDN +
              "/'};importScripts('" +
              CDN +
              "/vs/base/worker/workerMain.js');",
          ),
      };
      if (window.require && window.require.config) {
        require.config({ paths: { vs: CDN + "/vs" } });
        require(["vs/editor/editor.main"], initMonaco, initFallback);
      } else initFallback();
      $("run").onclick = run;
      $("dl").onclick = download;
      $("lang").onchange = (e) => {
        lang = e.target.value;
        store.set("abysa.lang", lang);
        loadLang();
      };
      $("cfg").onclick = () => {
        $("runUrl").value = cfg.runUrl;
        $("aiUrl").value = cfg.aiUrl;
        $("dlg").showModal();
      };
      $("cancel").onclick = () => $("dlg").close();
      $("save").onclick = () => {
        cfg.runUrl =
          $("runUrl").value.trim() || "https://wandbox.org/api/compile.json";
        cfg.aiUrl = $("aiUrl").value.trim();
        store.set("abysa.wandboxUrl", cfg.runUrl);
        store.set("abysa.aiUrl", cfg.aiUrl);
        $("dlg").close();
      };
    </script>
  </body>
</html>
